<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datacenter Survival</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0f14; font-family: 'Courier New', monospace; }
    .glass-panel { background: rgba(13, 20, 28, 0.88); backdrop-filter: blur(8px); border: 1px solid rgba(96, 165, 250, 0.18); }
    .build-btn.active { border-color: #60a5fa; background: rgba(96, 165, 250, 0.15); }
    .build-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tut-pulse { animation: tutpulse 1.1s ease-in-out infinite; border-color: #fbbf24 !important; }
    .paused-cta { background: rgba(217,119,6,.35) !important; border-color: #fbbf24 !important; color: #fde68a !important; animation: tutpulse 1.1s ease-in-out infinite; }
    @keyframes tutpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.55);} 50% { box-shadow: 0 0 0 7px rgba(251,191,36,0);} }
  </style>
</head>
<body>
  <div id="canvas-container" class="fixed inset-0"></div>

  <!-- Top HUD -->
  <div class="absolute top-4 left-1/2 -translate-x-1/2 z-10 pointer-events-none">
    <div class="glass-panel rounded-xl px-6 py-3 flex items-center gap-8 pointer-events-auto">
      <div class="text-center">
        <div class="text-[10px] text-gray-500 uppercase" data-i18n="hud_money">Money</div>
        <div id="hud-money" class="text-lg font-bold text-green-400">$800</div>
      </div>
      <div class="text-center">
        <div class="text-[10px] text-gray-500 uppercase" data-i18n="hud_reputation">SLA Rep</div>
        <div id="hud-rep" class="text-lg font-bold text-blue-300">100%</div>
      </div>
      <div class="text-center">
        <div class="text-[10px] text-gray-500 uppercase" data-i18n="hud_demand">Demand</div>
        <div id="hud-demand" class="text-lg font-bold text-amber-300">0 kW</div>
      </div>
      <div class="text-center">
        <div class="text-[10px] text-gray-500 uppercase" data-i18n="hud_served">Served</div>
        <div id="hud-served" class="text-lg font-bold text-emerald-300">0 kW</div>
      </div>
      <div class="text-center" title="Total facility power / IT power" data-i18n-title="hud_pue_tip">
        <div class="text-[10px] text-gray-500 uppercase">PUE</div>
        <div id="hud-pue" class="text-lg font-bold text-cyan-300">—</div>
      </div>
      <div class="flex items-center gap-2 pl-4 border-l border-gray-700">
        <button id="btn-faq" class="glass-panel rounded-lg px-3 py-2 text-gray-300 hover:text-white font-bold" onclick="showHelp()" title="FAQ">?</button>
        <button id="btn-pause" class="glass-panel rounded-lg px-4 py-2 text-blue-300 hover:text-white" onclick="togglePause()" title="Play / Pause (Space)" data-i18n-title="play_pause_tip">
          <svg id="icon-play" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button id="btn-overlay" class="glass-panel rounded-lg px-3 py-2 text-red-300 hover:text-white" onclick="toggleThermalOverlay()" title="Thermal overlay (T)" data-i18n-title="thermal_overlay_tip">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 3v10m0 0a3 3 0 1 0 3 3M12 13a3 3 0 0 1 3 3m-3-13a2 2 0 0 1 2 2v6.35A5 5 0 1 1 10 11.35V5a2 2 0 0 1 2-2z"/></svg>
        </button>
        <select id="lang-select" class="bg-gray-800 text-gray-300 text-xs rounded px-1 py-1" onchange="i18n.setLocale(this.value)">
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Paused pill -->
  <div id="paused-pill" class="hidden absolute top-24 left-1/2 -translate-x-1/2 z-10 glass-panel rounded-full px-5 py-2 text-amber-300 text-sm font-bold border border-amber-500/50" data-i18n="paused_pill">
    PAUSED — build freely, then press ▶
  </div>

  <!-- Event banner -->
  <div id="event-banner" class="hidden absolute top-24 left-1/2 -translate-x-1/2 z-10 glass-panel rounded-lg px-5 py-2 text-amber-300 text-sm font-bold"></div>

  <!-- Active mini-contract (rendered by src/ui/hud.js) -->
  <div id="contract-line" class="hidden absolute top-36 left-1/2 -translate-x-1/2 z-10 glass-panel rounded-lg px-4 py-1.5 text-cyan-200 text-xs font-bold"></div>

  <!-- Build toolbar -->
  <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-10">
    <div class="glass-panel rounded-2xl p-2 flex items-center gap-1" id="toolbar">
      <button class="build-btn glass-panel rounded-lg w-16 h-16 flex flex-col items-center justify-center text-gray-300" data-tool="select" onclick="setTool('select')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 4l7 16 2-7 7-2z"/></svg>
        <span class="text-[9px] mt-1 uppercase" data-i18n="tool_select">Select</span>
      </button>
      <button class="build-btn glass-panel rounded-lg w-16 h-16 flex flex-col items-center justify-center text-gray-300" data-tool="wire" onclick="setTool('wire')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        <span class="text-[9px] mt-1 uppercase" data-i18n="tool_wire">Wire</span>
      </button>
      <button class="build-btn glass-panel rounded-lg w-16 h-16 flex flex-col items-center justify-center text-gray-300" data-tool="demolish" onclick="setTool('demolish')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M3 6h18M8 6V4h8v2m-9 3v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V9"/></svg>
        <span class="text-[9px] mt-1 uppercase" data-i18n="tool_demolish">Demolish</span>
      </button>
      <div class="w-px h-12 bg-gray-700 mx-1"></div>
      <div id="build-palette" class="flex gap-1"><!-- buttons injected by ui/toolbar.js --></div>
    </div>
  </div>

  <!-- Wire hint -->
  <div id="wire-hint" class="hidden absolute bottom-28 left-1/2 -translate-x-1/2 z-10 glass-panel rounded px-4 py-2 text-xs text-cyan-200" data-i18n="wire_hint">
    Click a power source, then the building to feed.
  </div>

  <!-- Tutorial panel -->
  <div id="tutorial-panel" class="hidden absolute bottom-28 left-4 z-20 glass-panel rounded-xl p-4 w-80 border border-amber-500/40"></div>

  <!-- Main menu -->
  <div id="main-menu" class="absolute inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm">
    <div class="glass-panel rounded-2xl p-12 max-w-md w-full text-center border border-blue-500/30">
      <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-red-400 mb-1 tracking-tighter">DATACENTER<br/>SURVIVAL</h1>
      <p class="text-gray-400 text-xs mb-1" data-i18n="tagline">The physical layer of the cloud</p>
      <p class="text-gray-600 text-[10px] mb-8">v0.1 · sister of <a class="underline hover:text-gray-400" href="https://pshenok.github.io/server-survival/">Server Survival</a></p>
      <button onclick="startGame()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-lg uppercase tracking-wide mb-3" data-i18n="start_game">Power On</button>
      <button onclick="startTutorialGame()" class="w-full glass-panel hover:border-amber-500/50 text-amber-300 py-3 rounded-lg text-sm mb-3" data-i18n="menu_tutorial">Tutorial</button>
      <button onclick="showHelp()" class="w-full glass-panel hover:border-gray-500 text-gray-300 py-3 rounded-lg text-sm" data-i18n="how_to_play">How to play</button>
    </div>
  </div>

  <!-- FAQ modal (tabbed; content rendered by src/ui/faq.js) -->
  <div id="faq-modal" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/80">
    <div class="glass-panel rounded-2xl p-6 max-w-xl w-full mx-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xl font-bold text-white" data-i18n="faq_title">FAQ</h2>
        <button onclick="closeHelp()" class="text-gray-500 hover:text-white text-xl leading-none px-2">×</button>
      </div>
      <div id="faq-content"></div>
    </div>
  </div>

  <!-- Game over -->
  <div id="gameover-modal" class="hidden absolute inset-0 z-50 flex items-center justify-center pointer-events-none">
    <div class="glass-panel rounded-2xl p-10 text-center border border-red-500/40 pointer-events-auto">
      <h2 id="gameover-title" class="text-4xl font-black text-red-400 mb-2">FACILITY DOWN</h2>
      <p id="gameover-reason" class="text-gray-400 mb-1"></p>
      <p id="gameover-stats" class="text-gray-500 text-sm mb-6"></p>
      <button onclick="restartGame()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-8 rounded-lg uppercase" data-i18n="restart">Restart</button>
    </div>
  </div>

  <!-- Selected building panel -->
  <div id="inspect-panel" class="hidden absolute top-24 right-4 z-10 glass-panel rounded-xl p-4 w-64 text-xs text-gray-300"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
